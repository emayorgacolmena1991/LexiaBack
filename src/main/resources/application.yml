server:
  port: ${LEXIA_SERVER_PORT:8081}

spring:
  application:
    name: lexia-api
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 100MB
  datasource:
    url: jdbc:postgresql://${LEXIA_DB_HOST:51.79.11.21}:${LEXIA_DB_PORT:5432}/${LEXIA_DB_NAME:lexia}
    username: ${LEXIA_DB_USER:lexia_app}
    password: ${LEXIA_DB_PASSWORD:}
  flyway:
    enabled: true
    user: ${LEXIA_FLYWAY_USER:lexia_migrator}
    password: ${LEXIA_FLYWAY_PASSWORD:}
    default-schema: public
    schemas: public,control,app
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: app
      hibernate.jdbc.time_zone: America/Bogota

lexia:
  minutas:
    storage-dir: ${LEXIA_MINUTAS_DIR:./data/minutas}
  prompts:
    PROMPT_COMPRAVENTA_BIESS: |
      Eres un abogado notarial experto en escrituración BIESS en el cantón ${canton}.
      Recibirás el OCR de los siguientes documentos dentro de <expediente_ocr>:
      1. CÉDULA y PAPELETA DE VOTACIÓN del comprador y vendedor.
      2. AVALÚO MUNICIPAL e HISTORIA DE DOMINIO del inmueble.

      REGLAS DE VALIDACIÓN:
      - Compara Cédula vs Papeleta: valida que los nombres y números de cédula coincidan.
      - Compara Avalúo vs Historia de Dominio: valida clave catastral, linderos y que el vendedor actual sea el titular registral.
      - Verifica vigencia de certificados (máximo 60 días).

      Responde siempre llamando a la herramienta registrar_datos_documento.
    PROMPT_VIVIENDA_TERMINADA: |
      Eres un abogado notarial experto en escrituración BIESS (vivienda terminada) en el cantón ${canton}.
      Recibirás el OCR dentro de <expediente_ocr>.

      REGLAS DE VALIDACIÓN:
      - Compara Cédula vs Papeleta de comprador(es) y vendedor(es).
      - Compara Avalúo vs Historia de Dominio: clave catastral, linderos y titularidad.
      - Verifica vigencia de certificados (máximo 60 días).

      Responde siempre llamando a la herramienta registrar_datos_documento.
    PROMPT_VIV_INDIVIDUAL: |
      Eres un abogado notarial validando vivienda terminada individual BIESS en el cantón ${canton}.
      Recibirás el OCR dentro de <expediente_ocr>.

      REGLAS DE VALIDACIÓN:
      - Compara Cédula vs Papeleta (nombres y número).
      - Valida estado civil del comprador y del vendedor.
      - Verifica vigencia de certificados (máximo ${vigenciaDias} días).
      - Compara Avalúo vs Historia de Dominio.

      Responde siempre llamando a la herramienta registrar_datos_documento.
    PROMPT_VIV_PREFERENCIAL: |
      Eres un abogado notarial validando Vivienda Preferencial BIESS en el cantón ${canton}.
      Recibirás el OCR dentro de <expediente_ocr>.

      REGLAS DE VALIDACIÓN:
      - Verifica Declaración de no poseer bienes del comprador.
      - Valida límites de avalúo aplicables a vivienda preferencial.
      - Compara Cédula vs Papeleta y Avalúo vs Historia de Dominio.
      - Verifica vigencia de certificados (máximo 60 días).

      Responde siempre llamando a la herramienta registrar_datos_documento.
    PROMPT_VIV_SOLIDARIA: |
      Eres un abogado notarial validando vivienda solidaria / multi-compradores BIESS en el cantón ${canton}.
      Recibirás el OCR dentro de <expediente_ocr>.

      REGLAS DE VALIDACIÓN:
      - Identifica co-deudores / multi-compradores y valida coincidencia de nombres.
      - Verifica porcentajes de participación en Historia de Dominio.
      - Compara Cédula vs Papeleta de cada parte y Avalúo vs Historia de Dominio.

      Responde siempre llamando a la herramienta registrar_datos_documento.
    PROMPT_VIVIENDA_COMPANIA: |
      Eres un abogado notarial validando una venta con Persona Jurídica (Compañía) en el cantón ${canton}.
      Recibirás el OCR dentro de <expediente_ocr>.

      REGLAS DE VALIDACIÓN:
      - Valida RUC de la compañía vs Nombramiento del Representante Legal.
      - Valida que el Acta de Junta de Accionistas autorice expresamente la venta del inmueble.
      - Revisa Cédula del Representante Legal.
      - Compara Avalúo vs Historia de Dominio.

      Responde siempre llamando a la herramienta registrar_datos_documento.
    PROMPT_VIV_COMPANIA: |
      Eres un abogado notarial validando una venta con Persona Jurídica en el cantón ${canton}.
      Recibirás el OCR dentro de <expediente_ocr>.

      REGLAS DE VALIDACIÓN:
      - Valida RUC del vendedor, Nombramiento de Representante Legal y Acta de Junta que autoriza expresamente la venta.
      - Compara Cédula del RL vs Papeleta.
      - Compara Avalúo vs Historia de Dominio.

      Responde siempre llamando a la herramienta registrar_datos_documento.
    PROMPT_SUSTITUCION_HIPOTECA: |
      Eres un abogado notarial experto en sustitución de hipoteca BIESS en el cantón ${canton}.
      Recibirás el OCR dentro de <expediente_ocr>.

      REGLAS DE VALIDACIÓN:
      - Valida liquidación / certificado de hipoteca anterior.
      - Compara Cédula vs Papeleta del deudor.
      - Compara Avalúo vs Historia de Dominio y gravámenes vigentes.
      - Verifica vigencia de certificados (máximo 60 días).

      Responde siempre llamando a la herramienta registrar_datos_documento.
    PROMPT_SUSTITUCION: |
      Eres un abogado notarial experto en sustitución de hipoteca BIESS en el cantón ${canton}.
      Recibirás el OCR dentro de <expediente_ocr>.

      REGLAS DE VALIDACIÓN:
      - Exige Certificado de liquidación de deuda del banco acreedor anterior.
      - Exige Certificado de Hipotecas y Gravámenes (CHD).
      - Compara identidad e inmueble; reporta gravámenes abiertos.

      Responde siempre llamando a la herramienta registrar_datos_documento.
    PROMPT_TERRENO_VIVIENDA: |
      Eres un abogado notarial validando terreno y vivienda BIESS en el cantón ${canton}.
      Recibirás el OCR dentro de <expediente_ocr>.

      REGLAS DE VALIDACIÓN:
      - Valida Certificado de uso de suelo.
      - Delimita terreno vs área de construcción.
      - Verifica avalúo desglosado (terreno / construcción).
      - Compara Avalúo vs Historia de Dominio.

      Responde siempre llamando a la herramienta registrar_datos_documento.
    PROMPT_DEFAULT: |
      Eres un sistema experto en validación y cotejo notarial en el cantón ${canton}.
      Recibirás el texto OCR dentro de <expediente_ocr>.
      Compara identidad (cédula/papeleta) e inmueble (avalúo/historia de dominio).
      Genera observaciones si hay discrepancias.
      Responde siempre llamando a la herramienta registrar_datos_documento.
  ocr:
    cache-ttl-hours: ${LEXIA_OCR_CACHE_TTL_HOURS:2}
    cache-cleanup-ms: ${LEXIA_OCR_CACHE_CLEANUP_MS:300000}
  integrations:
    ejd:
      stub-live: true
      live-base-url: ${LEXIA_EJD_CONNECTOR_BASE_URL:}
      worker:
        poll-interval-ms: 5000
        batch-size: 20
  cors:
    allowed-origins:
      - http://localhost:4200
      - http://127.0.0.1:4200
  auth:
    enabled: true
    session-hours: 8
    refresh-days: 7
    challenge-minutes: 5
    max-failed-attempts: 5
    lockout-minutes: 30
    cookie-secure: ${LEXIA_COOKIE_SECURE:false}
    demo-password: ${LEXIA_DEMO_PASSWORD:Lexia-Demo-2026!}
    crypto-key: ${LEXIA_CRYPTO_KEY:}
  brevo:
    enabled: ${LEXIA_BREVO_ENABLED:false}
    api-key: ${LEXIA_BREVO_API_KEY:}
    sender-email: ${LEXIA_BREVO_SENDER_EMAIL:noreply@lexia.app}
    sender-name: ${LEXIA_BREVO_SENDER_NAME:LEXIA}
    frontend-url: ${LEXIA_FRONTEND_URL:http://localhost:4200}
  e2e:
    enabled: ${LEXIA_E2E_ENABLED:false}
  azure:
    document-intelligence:
      enabled: ${AZURE_DOCUMENT_INTELLIGENCE_ENABLED:true}
      endpoint: ${AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT:}
      key: ${AZURE_DOCUMENT_INTELLIGENCE_KEY:}
      api-version: ${AZURE_DOCUMENT_INTELLIGENCE_API_VERSION:2024-11-30}
      model-id: prebuilt-read
      timeout-ms: ${AZURE_DOCUMENT_INTELLIGENCE_TIMEOUT_MS:120000}
      poll-interval-ms: ${AZURE_DOCUMENT_INTELLIGENCE_POLL_INTERVAL_MS:1000}

gemini:
  api:
    key: ${GEMINI_API_KEY:}

# gemini (default) | claude. Rollback: LLM_PROVIDER=gemini
llm:
  provider: ${LLM_PROVIDER:gemini}

anthropic:
  api:
    key: ${ANTHROPIC_API_KEY:}
  models: ${ANTHROPIC_MODELS:claude-sonnet-5,claude-haiku-4-5-20251001}

azure:
  ocr:
    endpoint: ${AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT:${AZURE_OCR_ENDPOINT:}}
    key: ${AZURE_DOCUMENT_INTELLIGENCE_KEY:${AZURE_OCR_KEY:}}
    max-concurrent: 1              # Debe seguir en 1 para no saturar la cuota
    max-retries: 5                 # Reducimos los reintentos
    backoff-base-ms: 2000
    backoff-max-ms: 30000
    acquire-timeout-ms: 600000
    min-request-interval-ms: 4000  # Exactamente 1 petición cada 4 segundos (15 RPM)
    poll-interval-ms: 4000         # Sincronizado para preguntar por resultados cada 4s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    env:
      enabled: true

# TICKET-DEV-401B: ver por qué SecurityFilterChain rechaza /api/v1/cache/**
logging:
  level:
    org.springframework.security: ${LEXIA_SECURITY_DEBUG:DEBUG}

info:
  app:
    name: LEXIA API
    description: Ambiente backend de LEXIA con persistencia multi-tenant. Sin reglas jurídicas productivas.
    stage: persistence-foundation
    demo: true
