# Perfil puntual: sube referencias de disco a B2 y normaliza rutas absolutas.
# Uso: LEXIA_STORAGE_PROVIDER=b2 ... --spring.profiles.active=migrar-storage --dry-run=false
spring:
  main:
    web-application-type: none
  flyway:
    enabled: false
  # lexia_app queda sujeto a RLS: sin tenant no ve filas de app.*
  datasource:
    username: ${LEXIA_FLYWAY_USER:lexia_migrator}
    password: ${LEXIA_FLYWAY_PASSWORD:}

lexia:
  storage:
    migracion:
      dry-run: true
      lote: 200